[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorypatcher"
version = "0.1.0"
description = "Windows process memory training utility with search, refine, watch, and freeze capabilities."
authors = [{name = "Mehmet Erendereli"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "colorama>=0.4",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=memory_patcher --cov-report=term-missing"
testpaths = ["tests"]
